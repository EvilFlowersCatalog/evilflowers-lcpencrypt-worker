name: Tests

# Pushes to and PRs into develop/master run this through docker.yml (as the build's gate), so
# they are excluded here to avoid running it twice.
on:
  pull_request:
    branches-ignore: [ develop, master ]
  push:
    branches-ignore: [ develop, master ]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The real-worker tests (`tests/test_runtime.py`: SIGTERM requeue, delivery cap) run a prefork worker against it;
    # with `CI` set they fail instead of skipping when it is missing.
    services:
      redis:
        image: redis:7-alpine
        ports: [ "6379:6379" ]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install poetry
        run: pipx install "poetry>=2,<3"

      - name: Install dependencies (locked, with the observability extra)
        run: poetry sync --all-extras

      - name: ruff
        run: poetry run ruff check --output-format=github .

      - name: black
        run: poetry run black --check .

      - name: mypy (strict)
        run: poetry run mypy

      - name: pytest
        run: poetry run pytest --cov=evilflowers_lcpencrypt_worker --cov-report=term-missing
