[tool.poetry]
name = "evilflowers-lcpencrypt-worker"
version = "0.1.0"
description = "EvilFlowers Redium lcpencrypt Worker"
authors = ["Jakub Dubec <jakub.dubec@stuba.sk>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.14"
celery = {version = "^5.5.0", extras = ["redis"]}
logfire = {version = "*", extras = ["celery", "redis", "system-metrics"], optional = true}

[tool.poetry.extras]
observability = ["logfire"]

[tool.poetry.group.dev.dependencies]
black = "^26.1.0"
pytest = "^8.0"
pytest-cov = "^6.0"

[tool.black]
line-length = 119
target-version = ['py314']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.github
  | .venv
  | data
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
